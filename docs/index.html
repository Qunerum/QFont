<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>QFont Generator</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
        <div class="app-layout">
            <div class="left-sidebar">
                <h3>Characters</h3>
                <div class="add-char-box">
                    <div class="input-row-inline">
                        <div class="input-group">
                            <label>Width:</label>
                            <input type="number" id="newCols" min="1" max="127" value="8">
                        </div>
                        <div class="input-group">
                            <label>Height:</label>
                            <input type="number" id="newRows" min="1" max="127" value="8">
                        </div>
                    </div>
                    <button id="addCharBtn">Add character</button>
                </div>
                <div class="chars-list" id="charsList" style="color: #7a7c7d; font-size: 0.85rem; padding: 5px;">No characters...</div>
                <div class="sidebar-preview-box">
                    <div class="preview-header">
                        <span class="preview-title">Live preview</span>
                        <input type="range" id="previewZoomSlider" min="1" max="16" value="4" title="Zoom">
                    </div>
                    <div class="preview-canvas-wrapper" id="previewWrapper"><canvas id="sidebarPreviewCanvas"></canvas></div>
                    <div class="download-box" style="display: flex; gap: 5px;">
                        <button id="generateBtn">Download QFont file</button>
                        <button id="saveAsBtn" title="Choose path and save..." style="width: 40px; font-size: 1.1rem;">📁</button>
                    </div>
                    <button id="loadFileBtn">Add characters from a file</button>
                    <input type="file" id="fileInput" accept=".qf" style="display: none;">
                </div>
            </div>
            <div class="main-content">
                <div class="controls">
                    <span id="activeCharInfo" style="font-weight: bold; color: #fff;">No character selected</span>
                    <div class="zoom-control">
                        <label for="zoomSlider">Zoom: </label>
                        <input type="range" id="zoomSlider" min="4" max="40" value="18">
                        <span id="zoomValue">18px</span>
                    </div>
                </div>
                <div id="gridWrapper"><div id="gridContainer"></div></div>
            </div>

            <div class="right-sidebar">
                <h3>Character data</h3>
                <button id="calculateBtn">Calculate</button>
                <div id="rightLogContent" class="log-content"></div>
            </div>
		</div>
		<script src="script.js"></script>
	</body>
</html>
